<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyzone IT - Keyword Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; }
        .keyword-item { background: #fff; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
        .keyword-item:hover { border-color: #3b82f6; background: #eff6ff; transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900">Skyzone IT <span class="text-blue-600">Dashboard</span></h1>
            <p id="counter" class="text-slate-500 mt-2">Loading...</p>
        </header>

        <!-- Bulk Import - তুমি ছাড়া কেউ দেখবে না, PIN দিয়ে লক করা -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-dashed border-slate-300">
            <h3 class="font-bold text-slate-800 mb-2">🔒 Admin Bulk Import (শুধু তোমার জন্য)</h3>
            <p class="text-xs text-slate-400 mb-3">এখানে চ্যাট থেকে কিওয়ার্ড কপি করে Paste করো। এক লাইনে একটা কিওয়ার্ড, অথবা JSON Array.</p>
            <textarea id="bulkInput" rows="6" class="w-full p-3 border rounded-xl text-sm" placeholder="Secure Crypto Wallet&#10;International Remittance&#10;..."></textarea>
            <button onclick="bulkImport()" class="mt-3 bg-slate-900 text-white px-6 py-2 rounded-full font-bold text-sm">Firebase এ Save করো</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6 min-h-[400px]">
            <div id="keywordList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            <div id="emptyState" class="text-center py-20 text-slate-400 hidden">কোনো কী-ওয়ার্ড নেই।</div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 hidden bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 text-sm">কপি & ডিলিট হয়েছে!</div>

<script>
const firebaseConfig = {
  apiKey: "__FIREBASE_API_KEY__",
  authDomain: "email-marketing-d7587.firebaseapp.com",
  databaseURL: "https://email-marketing-d7587-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "__FIREBASE_PROJECT_ID__",
  storageBucket: "email-marketing-d7587.firebasestorage.app",
  messagingSenderId: "317421169576",
  appId: "1:317421169576:web:c11a90d1033385d6720b9d"
};
const APP_ID = 'keyword-bot-pro';
const ADMIN_PIN = '1234'; // এটা পরিবর্তন করে দাও

let db, auth;
async function initApp() {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore(); auth = firebase.auth();
    await auth.signInAnonymously();
    listenToKeywords();
}
function listenToKeywords() {
    const colRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('keywords');
    colRef.orderBy('createdAt', 'desc').onSnapshot(snap => {
        const listEl = document.getElementById('keywordList');
        const counter = document.getElementById('counter');
        const empty = document.getElementById('emptyState');
        listEl.innerHTML = '';
        counter.innerText = `${snap.size} টি কী-ওয়ার্ড অবশিষ্ট আছে`;
        empty.style.display = snap.empty ? 'block' : 'none';
        snap.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            div.className = 'keyword-item p-4 rounded-xl flex justify-between items-center';
            div.innerHTML = `<span class="font-semibold text-slate-700">${data.word}</span><span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold">COPY</span>`;
            div.onclick = () => copyAndDelete(doc.id, data.word);
            listEl.appendChild(div);
        });
    });
}
async function copyAndDelete(docId, text) {
    await navigator.clipboard.writeText(text);
    const toast = document.getElementById('toast'); toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 1500);
    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('keywords').doc(docId).delete();
}
async function bulkImport() {
    const pin = prompt('Admin PIN দাও:');
    if(pin !== ADMIN_PIN) return alert('ভুল PIN');
    const raw = document.getElementById('bulkInput').value.trim();
    if(!raw) return;
    let keywords = [];
    try { // JSON হলে
        const parsed = JSON.parse(raw);
        keywords = Array.isArray(parsed) ? parsed : parsed.keywords || [];
    } catch(e) { // না হলে লাইন বাই লাইন
        keywords = raw.split('\n').map(s=>s.trim()).filter(Boolean);
    }
    if(keywords.length === 0) return alert('কোনো keyword পাইনি');
    const colRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('keywords');
    const batch = db.batch();
    keywords.slice(0,500).forEach(word => {
        batch.set(colRef.doc(), { word, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    alert(`${keywords.length} টা Save হয়েছে!`);
    document.getElementById('bulkInput').value = '';
}
window.onload = initApp;
</script>
</body>
</html>
